# Single source of truth for dependency and plugin versions.
# Versions are referenced as libs.versions.<name>, dependencies as libs.<alias>.
[versions]
androidx-annotation = "1.10.0"
apk-parser = "2.6.10"
apksig = "9.4.1"
avif-imageio = "0.1.0"
bcprov = "1.86"
coroutines = "1.11.0"
dex-translator = "2.4.38"
extensions-lib = "6e0c96cea8" # TODO: split? extensions-lib 1.4 and 1.6 19398bb36a 42255ee5fa
gson = "2.14.0"
icu4j = "78.3"
injekt-core = "4135455a2a"
jcef = "150.0.14-g7c1aa68-chromium-150.0.7871.129-api-1.21-263-b11"
jsoup = "1.23.2"
kodein-di = "7.33.0"
kotlin-gradle = "2.4.21-RC"
kotlin-logging = "3.0.5"
logback = "1.6.4"
multiplatform-settings = "1.3.0"
okhttp = "5.5.0"
protobuf-gradle = "0.10.0"
protobuf-java = "4.36.2"
quickjs = "0.9.2"
rxjava = "1.3.8"
serialization = "1.12.0-RC"
spotless = "8.10.3"
twelvemonkeys = "3.15.2"
typesafe-config = "1.4.3"
webp-imageio = "0.11.0"
xmlpull = "1.1.3.4a"
zstd = "0.4.0"

[libraries]
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidx-annotation" }
apk-parser = { module = "net.dongliu:apk-parser", version.ref = "apk-parser" }
apksig = { module = "com.android.tools.build:apksig", version.ref = "apksig" }
avif-imageio-native-reader = { module = "io.github.nemanjastokuca:avif-imageio-native-reader", version.ref = "avif-imageio" }
bcprov-jdk18on = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bcprov" }
dex-translator = { module = "de.femtopedia.dex2jar:dex-translator", version.ref = "dex-translator" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
icu4j = { module = "com.ibm.icu:icu4j", version.ref = "icu4j" }
injekt-core = { module = "com.github.null2264.injekt:injekt-core", version.ref = "injekt-core" }
jcef = { module = "org.jetbrains.intellij.deps.jcef:jcef", version.ref = "jcef" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
keiyoushi-extensions-lib = { module = "com.github.keiyoushi:extensions-lib", version.ref = "extensions-lib" }
kodein-di-conf-jvm = { module = "org.kodein.di:kodein-di-conf-jvm", version.ref = "kodein-di" }
kotlin-logging = { module = "io.github.microutils:kotlin-logging", version.ref = "kotlin-logging" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-serialization-json-okio = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json-okio", version.ref = "serialization" }
kotlinx-serialization-protobuf = { module = "org.jetbrains.kotlinx:kotlinx-serialization-protobuf", version.ref = "serialization" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
mockwebserver3 = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
multiplatform-settings-jvm = { module = "com.russhwolf:multiplatform-settings-jvm", version.ref = "multiplatform-settings" }
multiplatform-settings-serialization-jvm = { module = "com.russhwolf:multiplatform-settings-serialization-jvm", version.ref = "multiplatform-settings" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-brotli = { module = "com.squareup.okhttp3:okhttp-brotli", version.ref = "okhttp" }
okhttp-zstd = { module = "com.squareup.okhttp3:okhttp-zstd", version.ref = "okhttp" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf-java" }
protoc = { module = "com.google.protobuf:protoc", version.ref = "protobuf-java" }
quickjs-jvm = { module = "app.cash.quickjs:quickjs-jvm", version.ref = "quickjs" }
rxjava = { module = "io.reactivex:rxjava", version.ref = "rxjava" }
twelvemonkeys-imageio-jpeg = { module = "com.twelvemonkeys.imageio:imageio-jpeg", version.ref = "twelvemonkeys" }
twelvemonkeys-imageio-webp = { module = "com.twelvemonkeys.imageio:imageio-webp", version.ref = "twelvemonkeys" }
typesafe-config = { module = "com.typesafe:config", version.ref = "typesafe-config" }
webp-imageio = { module = "com.github.usefulness:webp-imageio", version.ref = "webp-imageio" }
xmlpull = { module = "xmlpull:xmlpull", version.ref = "xmlpull" }
zstd-kmp-okio = { module = "com.squareup.zstd:zstd-kmp-okio", version.ref = "zstd" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin-gradle" }
protobuf = { id = "com.google.protobuf", version.ref = "protobuf-gradle" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
